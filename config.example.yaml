listen: ":6464"
timezone: Australia/Brisbane

device:
  host: 192.168.1.221
  # Pixoo-64 II / newer firmware: http://192.168.1.221:9000/divoom_api
  # endpoint: ""
  # Minimum gap between frame pushes. The panel needs 0.5-2 s per frame on a
  # weak 2.4 GHz link, so anything under 1 s only queues.
  frame_interval: 1s
  request_timeout: 10s
  # Keep idle scenes below the firmware's 5s HTTP-session timeout.
  heartbeat_interval: 2s
  # Re-send an unchanged frame this often as a safety net.
  refresh_every: 30m
  gif_id_reset_every: 32
  # Legacy safety valve. The keep-alive above avoids the socket exhaustion
  # that was previously mistaken for a per-frame heap leak.
  reboot_after_pushes: 0
  # Omit to leave the panel's own brightness setting alone.
  brightness: 70
  sync_time: true

# Individual still-image updates can be submitted here and are assembled into
# one device-side animation. The first frame appears immediately; subsequent
# clips are uploaded in bounded batches while the previous clip keeps looping.
stream:
  max_frames: 30
  frame_delay: 1s
  flush_after: 30s
  source_lease: 2m

beacon:
  url: http://192.168.1.139:5052
  validators: []

scenes:
  clock:
    kind: clock
    options:
      format: 24h
      date: true
      weather: true
      color: white
      accent: cyan
  beacon:
    kind: beacon
    options:
      # This firmware wedges on slow GIF updates but survived a 689-frame
      # one-second soak. Keep the upload path continuously active.
      refresh: 1s

rotation:
  - scene: clock
    duration: 5m
  - scene: beacon
    duration: 5m

log:
  level: info
  format: text
